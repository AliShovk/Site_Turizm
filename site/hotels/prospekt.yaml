about: >-
  «Проспект» — четырёхзвёздочный отель на проспекте Победы в центральной части
  Кисловодска. От отеля можно пешком дойти до вокзала, Нарзанной галереи
  и Колоннады — главного входа в Курортный парк. В отеле 24 номера семи
  категорий: двухместные стандарты, улучшенные номера, номер с террасой
  и семейные номера площадью до 42 м².

