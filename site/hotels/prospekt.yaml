faq:
  - q: Чем бронь на сайте лучше, чем через агрегатор?
    a: Вы бронируете напрямую у отеля — без посредника и его комиссии. Подтверждение приходит сразу, все вопросы решаются с администратором напрямую.
  - q: Как забронировать номер?
    a: Выберите даты и число гостей и нажмите «Показать цены». Откроется система бронирования отеля с актуальными ценами и свободными номерами.
  - q: Какие документы нужны при заселении?
    a: Паспорт или другой документ, удостоверяющий личность, — на каждого взрослого гостя. Для детей — свидетельство о рождении.
  - q: Можно ли заказать такси до отеля?
    a: Да. На странице «Как добраться» есть кнопки Яндекс Go и Maxim, а ресепшн может вызвать машину по звонку.
  - q: Как связаться с отелем?
    a: Позвоните по телефону +7 928 811-22-27, напишите в WhatsApp или на hotelprospekt@mail.ru.
